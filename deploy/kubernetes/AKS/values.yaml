nameOverride: ""
fullnameOverride: ""

image:
  repository: arc-operations-dashboard
  tag: "1.0.2"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

dashboard:
  port: 8766
  administratorUsers: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

workloadIdentity:
  clientId: "00000000-0000-0000-0000-000000000000"
  tenantId: "00000000-0000-0000-0000-000000000000"
  subscriptionId: "00000000-0000-0000-0000-000000000000"

serviceAccount:
  name: ""
  annotations: {}
  labels: {}

oauth2Proxy:
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: "v7.15.4"
    digest: ""
    pullPolicy: IfNotPresent
  tenantId: "00000000-0000-0000-0000-000000000000"
  existingSecret: arc-dashboard-oauth2-proxy
  secretKeys:
    clientId: client-id
    clientSecret: client-secret
    cookieSecret: cookie-secret
  scopes:
    - openid
    - profile
    - email
    - offline_access
    - https://ai.azure.com/.default
  allowedGroups: []
  cookie:
    name: __Host-arc-dashboard
    expire: 8h
    refresh: 1h
    sameSite: lax
  extraArgs: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

persistence:
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  retain: true

service:
  port: 80
  annotations: {}

ingress:
  className: nginx
  host: arc-dashboard.example.com
  annotations: {}
  tls:
    secretName: arc-dashboard-tls

networkPolicy:
  enabled: true
  ingress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/component: controller
  egress:
    dns:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    httpsCidrs:
      - 0.0.0.0/0
      - ::/0

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30
