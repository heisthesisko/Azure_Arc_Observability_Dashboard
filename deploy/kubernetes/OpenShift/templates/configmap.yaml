{{- $oauthScopes := .Values.oauth2Proxy.scopes -}}
{{- if .Values.foundry.enabled -}}
{{- $oauthScopes = concat $oauthScopes .Values.foundry.scopes -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arc-dashboard.fullname" . }}
  labels:
    {{- include "arc-dashboard.labels" . | nindent 4 }}
data:
  ARC_DASHBOARD_DATA_ROOT: /var/lib/arc-dashboard
  ARC_DASHBOARD_BIND_ADDRESS: "127.0.0.1"
  ARC_DASHBOARD_PORT: {{ .Values.dashboard.port | quote }}
  ARC_DASHBOARD_ACCESS_MODE: TrustedProxy
  ARC_DASHBOARD_AZURE_AUTH_MODE: WorkloadIdentity
  ARC_DASHBOARD_ADMIN_USERS: {{ join "," .Values.dashboard.administratorUsers | quote }}
  AZURE_CONFIG_DIR: /var/lib/arc-dashboard/.azure
  AZURE_FEDERATED_TOKEN_FILE: /var/run/secrets/azure/tokens/azure-identity-token
  AZURE_TENANT_ID: {{ .Values.azureIdentity.tenantId | quote }}
  AZURE_CLIENT_ID: {{ .Values.azureIdentity.clientId | quote }}
  AZURE_SUBSCRIPTION_ID: {{ .Values.azureIdentity.subscriptionId | quote }}
  OAUTH2_PROXY_REDIRECT_URL: {{ printf "https://%s/oauth2/callback" .Values.route.host | quote }}
  OAUTH2_PROXY_EMAIL_DOMAINS: {{ join "," .Values.oauth2Proxy.emailDomains | quote }}
  OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
  OAUTH2_PROXY_COOKIE_NAME: __Host-arc-dashboard
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
  OAUTH2_PROXY_COOKIE_SAMESITE: lax
  OAUTH2_PROXY_COOKIE_EXPIRE: {{ .Values.oauth2Proxy.cookieExpire | quote }}
  OAUTH2_PROXY_COOKIE_REFRESH: {{ .Values.oauth2Proxy.cookieRefresh | quote }}
  OAUTH2_PROXY_SESSION_STORE_TYPE: cookie
  OAUTH2_PROXY_PING_PATH: /ping
  OAUTH2_PROXY_READY_PATH: /ready
  OAUTH2_PROXY_SKIP_AUTH_ROUTES: ^/signed-out.html$
  oauth2-proxy-alpha.yaml: |
    upstreamConfig:
      upstreams:
        - id: arc-dashboard
          path: /
          uri: {{ printf "http://127.0.0.1:%d" (int .Values.dashboard.port) | quote }}
          passHostHeader: true
          proxyWebSockets: true
          timeout: 5m
    injectRequestHeaders:
      - name: X-Auth-Request-User
        values:
          - claimSource:
              claim: preferred_username
      - name: X-Auth-Request-Access-Token
        values:
          - claimSource:
              claim: access_token
    providers:
      - id: entra
        provider: oidc
        name: Microsoft Entra ID
        clientID: {{ .Values.oauth2Proxy.clientId | quote }}
        clientSecretFile: /etc/oauth2-proxy-secret/client-secret
        scope: {{ join " " $oauthScopes | quote }}
        code_challenge_method: S256
        skipClaimsFromProfileURL: true
        oidcConfig:
          issuerURL: {{ printf "https://login.microsoftonline.com/%s/v2.0" .Values.azureIdentity.tenantId | quote }}
          insecureAllowUnverifiedEmail: true
          emailClaim: preferred_username
          userIDClaim: preferred_username
