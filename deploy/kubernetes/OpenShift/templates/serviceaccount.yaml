{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "arc-dashboard.serviceAccountName" . }}
  labels:
    {{- include "arc-dashboard.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.azureIdentity.clientId | quote }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
